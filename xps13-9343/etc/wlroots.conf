# Broadwell i915 + wlroots: force software cursor so wlroots never touches the
# hardware cursor plane (plane 44), which fails its DRM atomic commit and hard-
# freezes Sway on resume from suspend.
# See https://github.com/cboettig/xps/blob/master/xps13-9343/display.md
# GNOME/mutter ignores WLR_* vars, so this is safe to leave set globally.
WLR_NO_HARDWARE_CURSORS=1
