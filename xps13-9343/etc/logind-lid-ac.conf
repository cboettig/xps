# /etc/systemd/logind.conf.d/50-lid-ac.conf
# Closing the lid on AC power does nothing; on battery it still suspends.
# Without this, HandleLidSwitchExternalPower inherits HandleLidSwitch=suspend,
# and the "docked" exemption only holds while an external display stays
# connected, so the machine suspends whenever that display drops out.
# See https://github.com/cboettig/xps/blob/master/xps13-9343/README.md#suspend
[Login]
HandleLidSwitchExternalPower=ignore
