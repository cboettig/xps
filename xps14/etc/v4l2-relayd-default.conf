# Built-in camera (Intel IPU7 / ov08x40) is mounted upside-down: the kernel reports
# V4L2_CID_CAMERA_SENSOR_ROTATION = 180 (read-only), and nothing acts on it automatically.
# icamerasrc's own flip-mode does the 180 inside the HAL. Use this rather than:
#   * "! videoconvert ! videoflip method=rotate-180" appended here -- v4l2-relayd silently
#     drops chained elements in both its -i and -o pipelines (the element itself works fine).
#   * V4L2_CID_HFLIP/VFLIP on the sensor subdev, via v4l2-ctl, a udev rule, an ExecStartPre,
#     or a "control" block in /etc/camera/ipu75xa/sensors/ov08x40-uf.json -- the write is
#     accepted and reads back as 1, but only intermittently reaches the sensor.
VIDEOSRC=icamerasrc buffer-count=7 flip-mode=vhflip
FORMAT=NV12
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL=Intel MIPI Camera
