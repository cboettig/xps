# Local override: prefer the generic HWE kernel for the default boot entry.
# oem-flavour.cfg (symlink into oem-somerville-hypno-meta) sets GRUB_FLAVOUR_ORDER=oem, which
# makes grub-sort-version rank *-oem ahead of *-generic regardless of version number.
# grub-mkconfig sources /etc/default/grub.d/*.cfg in glob order, so "zz-" is read after
# "oem-flavour.cfg" and this assignment wins. Package updates rewrite oem-flavour.cfg, not this.
GRUB_FLAVOUR_ORDER=generic
